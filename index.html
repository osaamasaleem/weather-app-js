<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather App</h1>
    
    <form action="" id="searchForm">
      <div class="search-primary-row">
          <div class="search-input-wrapper">
            <input type="text" id="searchInput" placeholder="Enter city name..." autocomplete="off">
            <!-- Suggestions dropdown sits right here! -->
            <ul id="suggestionsList" class="suggestions-list hidden"></ul>
          </div>
          <button id="searchButton">Search</button>
      </div>

      <div class="form-actions">
        <button id="locateButton" type="button" title="Use current location">📍 Locate</button>
        <button id="unitToggle" class="unit-toggle" type="button">Switch to °F</button>
      </div>

    </form>

    <div id="searchHistory" class="hidden">
      <h3 id="historyHeading">Recent Searches</h3>
      <button id="clearHistory">Clear</button>

      <div id="recentChips"></div>

    </div>


    <p id="errorMessage" class="hidden"></p>
    <p id="loadingIndicator" class="hidden">Fetching weather...</p>

    <article id="weatherCard" class="hidden">
  <header>
    <h2 id="cityName">--</h2>
    <p id="weatherDescription">--</p>
  </header>

  <div class="weather-main">
    <img id="weatherIcon" src="" alt="Weather condition icon">
    <p id="temperature">--</p>
  </div>

  <ul class="weather-details">
    <li>Feels Like: <span id="feelsLike">--</span></li>
    <li>Humidity: <span id="humidity">--</span></li>
    <li>Wind Speed: <span id="windSpeed">--</span></li>
  </ul>

  <section class="forecast-section">
    <h3>3-Day Forecast</h3>
    <div id="forecastContainer" class="forecast-container"></div>
  </section>
</article>

    <script src="script.js"></script>
    
</body>
</html>
